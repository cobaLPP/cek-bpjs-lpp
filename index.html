<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#2b55a7">
<meta name="robots" content="noindex,nofollow">
<title>Cek BPJS Pengemudi LPP</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: satu kolom tenang selebar kartu ponsel; layar beranda -> pilih jenis -> isi NIK -> hasil */
:root{
  /* Terang saja: putih + biru Bluebird */
  --bg:#f4f7fc; --surface:#ffffff; --ink:#16233f; --muted:#5b6886; --line:#dbe3f1;
  --brand:#2b55a7; --brand-dk:#1d3f86; --brand-soft:#e8eefa;
  --tk:#2b55a7; --tk-soft:#e8eefa; --ks:#1f86c7; --ks-soft:#e5f3fb;
  --ok:#1f7a4d; --ok-soft:#e3f4ea; --warn:#9a6411; --warn-soft:#fbf0dc; --bad:#b23a35; --bad-soft:#fbe7e5;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:14px; color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-direction:column;gap:6px;background:linear-gradient(135deg,var(--brand) 0%,var(--brand-dk) 100%);color:#fff;border-radius:18px;padding:22px 20px}
header .eyebrow{color:#cfdcf6}
header .muted{color:#e3eafa}
.btn{box-shadow:0 2px 6px rgba(43,85,167,.25)}
.choice{box-shadow:0 1px 3px rgba(22,35,63,.06)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-size:26px;line-height:1.2;margin:0;font-weight:700;text-wrap:balance}
h2{font-size:19px;margin:0;font-weight:700;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.choices{display:grid;gap:12px}
.choice{all:unset;cursor:pointer;display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:14px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.choice:hover{border-color:var(--c)}
.choice:focus-visible,.btn:focus-visible,input:focus-visible,.link:focus-visible{outline:2px solid var(--c,var(--tk));outline-offset:2px}
.choice .ic{width:48px;height:48px;border-radius:12px;background:var(--soft);color:var(--c);display:grid;place-items:center;font-weight:700;font-size:15px}
.choice .t{font-weight:700;font-size:16px}
.choice .s{font-size:13px;color:var(--muted)}
.choice .arr{color:var(--c);font-size:20px}
.tk{--c:var(--tk);--soft:var(--tk-soft)} .ks{--c:var(--ks);--soft:var(--ks-soft)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px}
.back{all:unset;cursor:pointer;color:var(--muted);font-size:14px;font-weight:600;align-self:flex-start}
.back:hover{color:var(--ink)}
label{font-size:13px;font-weight:600;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}
input[type=text]{flex:1 1 220px;min-width:0;font:500 18px var(--mono);letter-spacing:.06em;padding:12px 14px;border-radius:10px;
  border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.btn{all:unset;cursor:pointer;background:var(--c,var(--tk));color:#fff;font-weight:700;padding:12px 20px;border-radius:10px;text-align:center}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--c,var(--tk));border:1px solid var(--line)}
.hint{font-size:13px;color:var(--muted)}
.period{display:inline-flex;gap:6px;align-items:center;font-size:13px;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--c);font-weight:600;align-self:flex-start}
.pill{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:6px 12px;border-radius:99px;align-self:flex-start}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
dl{margin:0;display:grid;grid-template-columns:minmax(120px,40%) 1fr;gap:10px 14px}
dt{color:var(--muted);font-size:13px}
dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.num{font-family:var(--mono);letter-spacing:.03em;font-variant-numeric:tabular-nums}
.copy{all:unset;cursor:pointer;font-size:12px;color:var(--c,var(--tk));margin-left:8px;font-family:var(--font);font-weight:600}
.src{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
footer{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.link{all:unset;cursor:pointer;color:var(--muted);text-decoration:underline}
.msg{font-size:13px;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn)}
.msg.err{background:var(--bad-soft);color:var(--bad)} .msg.good{background:var(--ok-soft);color:var(--ok)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
html{-webkit-text-size-adjust:100%}body{margin:0}
</style>
</head>
<body>
<main id="root" class="wrap"><p class="muted">Memuat data…</p></main>
<noscript><p style="padding:16px">Halaman ini membutuhkan JavaScript. Aktifkan JavaScript di browser Anda.</p></noscript>
<script>
(function(){
"use strict";
var DATA=null,root=document.getElementById("root");
var enc=new TextEncoder(),dec=new TextDecoder();
var BULAN=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
var state={view:"home",type:null};

function h(tag,attrs,kids){var e=document.createElement(tag);if(attrs)for(var k in attrs){var v=attrs[k];if(v==null||v===false)continue;
  if(k==="class")e.className=v;else if(k==="text")e.textContent=v;else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?"":v);}
  (kids||[]).forEach(function(c){if(c==null)return;e.appendChild(typeof c==="string"?document.createTextNode(c):c);});return e;}
function fmtDate(s){if(!s)return"-";var p=s.split("-");return (+p[2])+" "+BULAN[+p[1]-1]+" "+p[0];}
function fmtStamp(s){if(!s)return"-";var d=new Date(s);return d.getDate()+" "+BULAN[d.getMonth()]+" "+d.getFullYear();}

/* id + kunci AES diturunkan dari NIK (PBKDF2-SHA256); data hanya terbuka dengan NIK yang tepat */
function ub64u(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";var r=atob(s),b=new Uint8Array(r.length);for(var i=0;i<r.length;i++)b[i]=r.charCodeAt(i);return b;}
function b64u(buf){var s="",b=new Uint8Array(buf);for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");}
async function lookup(nik){
  var base=await crypto.subtle.importKey("raw",enc.encode(nik),"PBKDF2",false,["deriveBits"]);
  var bits=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:ub64u(DATA.salt),iterations:DATA.iter},base,352));
  var v=DATA.recs[b64u(bits.slice(0,12))];if(!v)return null;
  var key=await crypto.subtle.importKey("raw",bits.slice(12),"AES-GCM",false,["decrypt"]);var p=v.split(".");
  try{return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64u(p[0])},key,ub64u(p[1]))));}catch(e){return null;}
}

function periodOf(t){return DATA&&DATA.periode?DATA.periode[t]:null;}
function render(){
  root.textContent="";
  if(state.view==="home")renderHome();else renderCek();
  root.appendChild(h("footer",null,[h("span",{text:"Data diperbarui "+fmtStamp(DATA.updatedAt)}),h("span",{text:"HR PT Layanan Pusaka Prima"})]));
}
function renderHome(){
  root.appendChild(h("header",null,[h("span",{class:"eyebrow",text:"PT Layanan Pusaka Prima"}),h("h1",{text:"Cek BPJS Pengemudi LPP"}),
    h("p",{class:"muted",text:"Pilih jenis BPJS, lalu masukkan NIK pengemudi (16 digit sesuai KTP)."})]));
  var list=h("div",{class:"choices"});
  [["tk","TK","BPJS Ketenagakerjaan","Status kepesertaan dan nomor KPJ"],["ks","KS","BPJS Kesehatan","Status, nomor kartu JKN, dan anggota keluarga"]].forEach(function(c){
    var p=periodOf(c[0]);
    list.appendChild(h("button",{class:"choice "+c[0],type:"button",onclick:function(){state.view="cek";state.type=c[0];render();var i=document.getElementById("nik");if(i)i.focus();}},[
      h("span",{class:"ic",text:c[1]}),
      h("span",null,[h("span",{class:"t",text:c[2]}),h("br"),h("span",{class:"s",text:c[3]+(p?" · data "+p:"")})]),
      h("span",{class:"arr","aria-hidden":"true",text:"→"})]));
  });
  root.appendChild(list);
}
function renderCek(){
  var t=state.type,nm=t==="tk"?"BPJS Ketenagakerjaan":"BPJS Kesehatan",p=periodOf(t);
  root.appendChild(h("button",{class:"back",type:"button",onclick:function(){state.view="home";render();},text:"← Kembali ke pilihan"}));
  var input=h("input",{id:"nik",type:"text",inputmode:"numeric",autocomplete:"off",maxlength:"16",placeholder:"16 digit NIK","aria-label":"NIK pengemudi"});
  var btn=h("button",{class:"btn",type:"submit",disabled:true,text:"Cek"});
  var result=h("div",{id:"result",class:"choices","aria-live":"polite"});
  input.addEventListener("input",function(){var v=input.value.replace(/\D/g,"").slice(0,16);if(v!==input.value)input.value=v;btn.disabled=v.length!==16;});
  var form=h("form",{class:"card "+t},[
    h("span",{class:"eyebrow",text:"Cek "+nm}),h("h2",{text:"Masukkan NIK pengemudi"}),
    h("span",{class:"period",text:"Data periode "+(p||"-")}),
    h("div",{class:"row"},[input,btn]),
    h("p",{class:"hint",text:"Isi 16 digit NIK sesuai KTP. Data hanya tampil jika NIK lengkap dan tepat."})]);
  form.addEventListener("submit",async function(e){e.preventDefault();if(btn.disabled)return;btn.disabled=true;btn.textContent="Mencari…";
    var r=null;try{r=await lookup(input.value);}catch(err){r=null;}
    btn.textContent="Cek";btn.disabled=false;showResult(result,t,r);});
  root.appendChild(form);root.appendChild(result);
}
function copyBtn(v){return h("button",{class:"copy",type:"button",onclick:function(ev){var b=ev.currentTarget;
  var done=function(){b.textContent="Tersalin";setTimeout(function(){b.textContent="Salin";},1500);};
  try{navigator.clipboard.writeText(v).then(done,function(){sel(b);});}catch(e){sel(b);}},text:"Salin"});}
function sel(b){var r=document.createRange();r.selectNodeContents(b.previousSibling);var s=getSelection();s.removeAllRanges();s.addRange(r);}
function showResult(box,t,r){
  box.textContent="";var p=periodOf(t),nm=t==="tk"?"BPJS Ketenagakerjaan":"BPJS Kesehatan";
  var src=h("p",{class:"src",text:"Sumber: data tagihan "+nm+" LPP periode "+(p||"-")+", diperbarui "+fmtStamp(DATA.updatedAt)+"."});
  if(!r){box.appendChild(h("div",{class:"card "+t},[h("span",{class:"pill bad",text:"NIK tidak ditemukan"}),
    h("p",{text:"NIK ini tidak ada pada data tagihan "+nm+" LPP periode "+(p||"-")+". Periksa kembali 16 digit NIK. Jika sudah benar, hubungi HR LPP."}),src]));return;}
  if(t==="tk"){var k=r.tk;box.appendChild(h("div",{class:"card tk"},[
    h("span",{class:"pill ok",text:"Aktif, terdaftar periode "+p}),
    h("dl",null,[h("dt",{text:"Nama"}),h("dd",{text:k.n}),
      h("dt",{text:"No. KPJ"}),h("dd",null,[h("span",{class:"num",text:k.kpj}),copyBtn(k.kpj)]),
      h("dt",{text:"Peserta sejak"}),h("dd",{text:fmtDate(k.tgl)}),
      h("dt",{text:"Lokasi tugas"}),h("dd",{text:k.cust||"-"})]),src]));return;}
  var s=r.ks;
  if(!s){box.appendChild(h("div",{class:"card ks"},[h("span",{class:"pill warn",text:"Tidak ada di tagihan BPJS Kesehatan"}),
    h("p",{text:"Pengemudi "+r.tk.n+" terdaftar sebagai pengemudi LPP, tetapi tidak ada pada data tagihan BPJS Kesehatan LPP periode "+p+". Hubungi HR LPP untuk memastikan."}),src]));return;}
  box.appendChild(h("div",{class:"card ks"},[
    h("span",{class:"pill ok",text:"Aktif, terdaftar periode "+p}),
    h("dl",null,[h("dt",{text:"Nama"}),h("dd",{text:s.n}),
      h("dt",{text:"No. kartu JKN"}),h("dd",null,[h("span",{class:"num",text:s.jkn}),copyBtn(s.jkn)]),
      h("dt",{text:"Keluarga ditanggung"}),h("dd",{text:s.kel?s.kel+" orang"+(s.kelD?" ("+s.kelD+")":""):"Tidak ada"}),
      h("dt",{text:"Lokasi tugas"}),h("dd",{text:s.cust||r.tk.cust||"-"})]),src]));
}

if(!window.crypto||!crypto.subtle){root.innerHTML="";root.appendChild(h("p",{class:"msg err",text:"Browser ini terlalu lama untuk membuka halaman ini. Gunakan Chrome atau Safari versi terbaru."}));return;}
fetch("data/bpjs.json",{cache:"no-cache"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
  .then(function(d){DATA=d;render();})
  .catch(function(){root.textContent="";root.appendChild(h("p",{class:"msg err",text:"Data gagal dimuat. Periksa koneksi internet lalu muat ulang halaman."}));});
})();
</script>
</body>
</html>
